name: Build Dictado por comas v1.1 APK

on:
  push:
    branches:
      - chatgpt/dictado-por-comas-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v110:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct source project
        shell: bash
        run: |
          cat dictado-build-payload/v110-part1.b64 \
              dictado-build-payload/v110-part2.b64 \
              dictado-build-payload/v110-part3.b64 \
              dictado-build-payload/v110-part4.b64 \
              dictado-build-payload/v110-part5.b64 \
            | tr -d '\n' | base64 --decode > /tmp/DictadoPorComas-source-v1.1.0.zip
          mkdir -p /tmp/dictado-v110
          unzip -q /tmp/DictadoPorComas-source-v1.1.0.zip -d /tmp/dictado-v110
          test -f /tmp/dictado-v110/dictado-por-comas/settings.gradle

      - name: Build debug APK
        shell: bash
        run: |
          cd /tmp/dictado-v110/dictado-por-comas
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp /tmp/dictado-v110/dictado-por-comas/app/build/outputs/apk/debug/app-debug.apk \
             /tmp/DictadoPorComas-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DictadoPorComas-v1.1.0
          path: /tmp/DictadoPorComas-v1.1.0.apk
          if-no-files-found: error
          retention-days: 14
